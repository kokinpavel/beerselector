services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: untappt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-untappt}
      POSTGRES_DB: untappt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U untappt -d untappt"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    image: beerselector:local
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://untappt:${POSTGRES_PASSWORD:-untappt}@db:5432/untappt
      APP_ENV: development
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  bot:
    image: beerselector:local
    build: .
    profiles: ["bot"]
    command: ["python", "-m", "src.telegram.bot"]
    environment:
      DATABASE_URL: postgresql+asyncpg://untappt:${POSTGRES_PASSWORD:-untappt}@db:5432/untappt
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b-instruct}
      APP_ENV: development
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    profiles: ["bot"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["bot"]
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b-instruct}
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  postgres_data:
  ollama_data:
