[project]
name = "untappt-selector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "aiogram>=3.13,<4", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
ml = ["numpy>=2,<3", "scikit-learn>=1.5,<2"]
vision = ["pillow>=11,<13", "rapidfuzz>=3,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.7,<1", "mypy>=1.11,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/untappt_selector"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
